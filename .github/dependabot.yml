# Dependabot abre pull requests cuando salen versiones nuevas (el CI los valida).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Imágenes base de web, API y worker.
  - package-ecosystem: docker
    directories:
      - /web
      - /application
      - /worker
    schedule:
      interval: weekly

  # Dependencias de la API y del worker (pnpm).
  - package-ecosystem: npm
    directories:
      - /application
      - /worker
    schedule:
      interval: weekly

  # Providers de Terraform.
  - package-ecosystem: terraform
    directories:
      - /infra/terraform/envs/*
      - /infra/terraform/modules/*
    schedule:
      interval: weekly
