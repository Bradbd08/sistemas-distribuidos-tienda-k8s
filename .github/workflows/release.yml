name: Release

# En main (cuando cambian las imágenes) y en cada tag vX.Y.Z: construye y sube las imágenes a GHCR,
# las escanea, las firma con cosign (sin llaves, con el OIDC de GitHub) y adjunta su SBOM.
# Etiquetas:  sha-<commit>  en main,  X.Y.Z  en un tag vX.Y.Z.
# NO escribe la etiqueta nueva en Git: eso lo hace Flux image automation en el clúster de prod.
on:
  push:
    branches: [main]
    paths:
      - web/**
      - application/**
      - .github/workflows/release.yml
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  imagenes:
    name: Imagen ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # subir a GHCR con el GITHUB_TOKEN
      id-token: write # firma sin llaves (Fulcio) con el OIDC de GitHub
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tienda-web
            context: web
          - name: tienda-api
            context: application
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GHCR exige minúsculas y el dueño puede tener mayúsculas.
      - name: Nombre de la imagen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Construir y subir
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Trivy sobre la imagen publicada
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.76.2

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Se firma el digest (no la etiqueta): la etiqueta puede moverse, el digest no.
      # La firma sin llaves queda en el registro público Rekor con la identidad de este workflow.
      - name: Firmar con cosign
        run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"

      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          artifact-name: sbom-${{ matrix.name }}.spdx.json

      - name: Adjuntar el SBOM a la imagen (atestación firmada)
        run: |
          cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.name }}.spdx.json" \
            "$IMAGE@${{ steps.build.outputs.digest }}"
