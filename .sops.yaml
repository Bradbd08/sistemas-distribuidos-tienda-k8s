# Configuración de SOPS: cifra solo los valores (data y stringData) de los Secrets de Kubernetes.
# Las claves públicas son seguras de publicar. Las privadas no van a git: la de dev vive en ~/.config/sops/age/keys.txt
# y la de prod en ~/.config/sops/age/prod.txt. En cada clúster, la suya va en el Secret flux-system/sops-age.
# Cifrar un Secret nuevo:   sops --encrypt --in-place credentials/<entorno>/<archivo>.yaml
# Editar uno existente:     sops credentials/<entorno>/<archivo>.yaml   (prod: SOPS_AGE_KEY_FILE=~/.config/sops/age/prod.txt)
creation_rules:
  - path_regex: ^credentials/dev/.*\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: age1xdx9qjcmuf4zh0v4g09nmv58nqhaf27wu060rjxx06l92qwv73lq47c7d3
  # prod tiene su propia clave: la de dev no puede descifrarlo.
  - path_regex: ^credentials/prod/.*\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: age1nahvg7w7q4z3ssyzsrq2dadl0dky9trmsayzw2hjuywefw2mgs2q3v6lu8
