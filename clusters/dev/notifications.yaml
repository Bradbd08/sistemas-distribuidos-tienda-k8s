# Notificaciones de Flux a GitHub (estado del commit). Está SUSPENDIDO hasta que exista el Secret
# flux-system/github-token. Pasos para activarlo en deploy/platform/notifications/github.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: notifications
  namespace: flux-system
spec:
  suspend: true
  interval: 10m
  dependsOn:
    - name: apps
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/platform/notifications
  prune: true
