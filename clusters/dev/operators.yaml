# Entrada de Flux para el clúster de desarrollo (k3d "tienda"). Sigue la rama main.
# Orden de despliegue (dependsOn): operators -> secrets -> data -> apps -> network-policies.
# Cada capa espera a que la anterior esté lista.
#
# Regla de datos: ninguna capa que tenga bases de datos o Secrets usa prune. Si alguien borra un archivo
# del repo, Flux NO borra la base ni sus volúmenes.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: operators
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/platform/operators
  prune: true
  wait: true
  deletionPolicy: Orphan
