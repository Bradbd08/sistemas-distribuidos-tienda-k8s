# La tienda (web, API, worker, Job de inicialización, Ingress). En prod usa las imágenes de GHCR, con la etiqueta que fija Flux image automation.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  dependsOn:
    - name: data
    # nginx resuelve el Collector (observability) al arrancar: sin esa capa los pods web no inician.
    - name: observability
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/overlays/prod
  prune: true
  wait: true
