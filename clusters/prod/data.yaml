# Bases de datos: MariaDB Galera + MaxScale, MongoDB y Redis + Sentinel.
# Sin prune ni borrado en cascada: los datos no se pierden aunque se quite un archivo del repo.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: data
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 20m
  dependsOn:
    - name: operators
    - name: secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/platform/data
  prune: false
  wait: true
  deletionPolicy: Orphan
