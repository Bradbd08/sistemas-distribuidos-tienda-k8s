# Flux image automation (solo prod): vigila GHCR y, cuando sale una versión semver nueva (tag vX.Y.Z en Git,
# que release.yml publica como X.Y.Z), escribe la etiqueta nueva en deploy/overlays/prod/kustomization.yaml
# (los marcadores "$imagepolicy") y hace commit en la rama flux-image-updates, NO en release: release está
# protegida (pull request con aprobación) y esa aprobación es la puerta de promoción. Para desplegar la
# versión nueva se abre un pull request flux-image-updates -> release y alguien lo aprueba.
#
# Antes de eso, el tag vX.Y.Z hace que el pipeline construya, escanee, firme y publique la versión.
#
# Los paquetes de GHCR de un repositorio privado son privados: hace falta el Secret ghcr-pull (un token
# con read:packages) en flux-system y en tienda, cifrado con SOPS en credentials/prod/. Si haces públicos los
# dos paquetes en GitHub (Packages > Package settings > Change visibility), el Secret no es necesario.
# NO PROBADO todavía: necesita el clúster real y las credenciales de GHCR.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: tienda-web
  namespace: flux-system
spec:
  image: ghcr.io/bradbd08/tienda-web
  interval: 5m
  secretRef:
    name: ghcr-pull
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: tienda-api
  namespace: flux-system
spec:
  image: ghcr.io/bradbd08/tienda-api
  interval: 5m
  secretRef:
    name: ghcr-pull
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: tienda-web
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: tienda-web
  policy:
    semver:
      range: ">=0.1.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: tienda-api
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: tienda-api
  policy:
    semver:
      range: ">=0.1.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: tienda
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: release
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        Actualiza las imágenes de prod

        {{ .Changed.Summary }}
    push:
      branch: flux-image-updates
  update:
    path: ./deploy/overlays/prod
    strategy: Setters
