# Notificaciones de Flux a GitHub (estado de cada commit). Usan el Secret flux-system/github-token,
# cifrado en credentials/prod/github-token.yaml (token de solo "Commit statuses" para este repo).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: notifications
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: apps
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/platform/notifications
  prune: true
