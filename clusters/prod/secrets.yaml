# Contraseñas de producción, cifradas con SOPS (age). Flux las descifra con el Secret flux-system/sops-age.
# Sin prune: quitar un archivo del repo no borra el Secret de un servicio en uso.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: operators
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./credentials/prod
  prune: false
  deletionPolicy: Orphan
  decryption:
    provider: sops
    secretRef:
      name: sops-age
