# Capa de aplicación: reemplaza a app1-3, application-lb-* y galera-lb de Compose.
# Configuración 12-factor: ConfigMap "api-config" (valores públicos) + Secrets (contraseñas).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: tienda
spec:
  # Sin "replicas": el HorizontalPodAutoscaler fija el número (minReplicas).
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: tienda
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
      containers:
        - name: api
          # El overlay reemplaza el nombre y la etiqueta (images: en kustomization.yaml).
          image: tienda-api
          # Always: la etiqueta dev es mutable (scripts/build-images.sh la reemplaza) y con IfNotPresent los
          # nodos seguirían usando la imagen anterior.
          imagePullPolicy: Always
          # OpenTelemetry: --import carga telemetry.mjs antes que la API (solo se activa con OTEL_EXPORTER_OTLP_ENDPOINT).
          command: ["node", "--import", "./telemetry.mjs", "index.js"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-credentials
                  key: app-password
            # Cadena de conexión que genera el operador de MongoDB (incluye todos los miembros del replica set).
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-admin-store-app
                  key: connectionString.standard
            # Opcional: sin RabbitMQ (o sin el Secret) la API guarda las reseñas directo en MongoDB.
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: connection_string
                  optional: true
            # El nombre del pod sale en la traza de la página (antes: app1/app2/app3).
            - name: APPLICATION_NODE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Trazas y métricas al Collector (gateway). El nombre del pod identifica la instancia en Mimir (label "instance").
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-gateway.observability:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_SERVICE_NAME
              value: tienda-api
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=tienda,service.instance.id=$(K8S_POD_NAME)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          # La API no abre el puerto hasta conectar con MongoDB y Redis (hasta ~2 min): la sonda de
          # arranque evita que la sonda de vida la reinicie mientras tanto.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 60
          # Vida: solo el proceso. No toca las bases de datos, para no reiniciar en cadena.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          # Disponibilidad: llega a las tres bases de datos.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: tienda
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: tienda
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: tienda
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
