# Crea el esquema de MariaDB y los índices de MongoDB (catalog-init de Compose). Es idempotente.
# Los Jobs no se pueden modificar: Flux lo recrea si cambia (anotación force).
apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-init
  labels:
    app.kubernetes.io/name: catalog-init
    app.kubernetes.io/part-of: tienda
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 30
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-init
        app.kubernetes.io/part-of: tienda
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: tienda-api
          # Always: la etiqueta dev es mutable (scripts/build-images.sh la reemplaza) y con IfNotPresent los
          # nodos seguirían usando la imagen anterior.
          imagePullPolicy: Always
          command: ["node", "init-db.js"]
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-credentials
                  key: app-password
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-admin-store-app
                  key: connectionString.standard
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 192Mi }
          volumeMounts:
            # init-db.js lee /app/database/catalog.sql
            - name: catalog-sql
              mountPath: /app/database
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: catalog-sql
          configMap:
            name: catalog-sql
        - name: tmp
          emptyDir: {}
