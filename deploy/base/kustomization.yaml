apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tienda
resources:
  - web.yaml
  - api.yaml
  - worker.yaml
  - catalog-init.yaml
  - tls.yaml
  - ingress.yaml
configMapGenerator:
  # Valores no secretos de la API. Las contraseñas vienen de Secrets (ver api.yaml).
  - name: api-config
    literals:
      - DB_HOST=maxscale
      - DB_PORT=3306
      - DB_NAME=store
      - DB_USER=store_app
      - MONGO_DB=store_reviews
      - REDIS_HOST=redis-master
      - REDIS_PORT=6379
  # Copia de database/catalog.sql (Kustomize no puede leer fuera de esta carpeta). Si cambia uno, cambia el otro.
  - name: catalog-sql
    files:
      - catalog-init/catalog.sql
