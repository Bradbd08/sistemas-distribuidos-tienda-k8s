# Desarrollo: imágenes del registro del clúster k3d (scripts/build-images.sh las sube).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: tienda-web
    newName: tienda-registry:5000/tienda-web
    newTag: dev
  - name: tienda-api
    newName: tienda-registry:5000/tienda-api
    newTag: dev
  - name: tienda-worker
    newName: tienda-registry:5000/tienda-worker
    newTag: dev
patches:
  # k3d publica el 443 del clúster en el 8443 del host (--port 8443:443): la redirección debe apuntar ahí.
  - target:
      kind: Middleware
      name: redirigir-https
    patch: |-
      - op: add
        path: /spec/redirectScheme/port
        value: "8443"
