# Producción (clúster real de 2 laptops): imágenes de GHCR y 3 réplicas mínimas.
# PENDIENTE (Etapa 2): reemplazar OWNER/REPO por el dueño y nombre del repo privado de GitHub, y
# la etiqueta por la que publique release.yml (sha-<commit>). Hasta entonces este overlay no se despliega.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: tienda-web
    newName: ghcr.io/OWNER/REPO/tienda-web
    newTag: PENDIENTE
  - name: tienda-api
    newName: ghcr.io/OWNER/REPO/tienda-api
    newTag: PENDIENTE
patches:
  # 3 réplicas mínimas (en dev son 2).
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
