# Producción (clúster real de 2 laptops): imágenes públicas de GHCR y 3 réplicas mínimas.
# Las etiquetas las actualiza Flux image automation (clusters/prod/image-automation.yaml) con los
# marcadores $imagepolicy: no las edites a mano. 0.1.0 es la primera versión: se publica con
#   git tag v0.1.0 && git push origin v0.1.0     (release.yml construye y firma las imágenes)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - tls-prod.yaml
images:
  - name: tienda-web
    newName: ghcr.io/bradbd08/tienda-web # {"$imagepolicy": "flux-system:tienda-web:name"}
    newTag: 0.1.0 # {"$imagepolicy": "flux-system:tienda-web:tag"}
  - name: tienda-api
    newName: ghcr.io/bradbd08/tienda-api # {"$imagepolicy": "flux-system:tienda-api:name"}
    newTag: 0.1.0 # {"$imagepolicy": "flux-system:tienda-api:tag"}
  - name: tienda-worker
    newName: ghcr.io/bradbd08/tienda-worker # {"$imagepolicy": "flux-system:tienda-worker:name"}
    newTag: 0.1.0 # {"$imagepolicy": "flux-system:tienda-worker:tag"}
patches:
  # 3 réplicas mínimas (en dev son 2).
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
  # Entrada de prod: la IP de Tailscale de la laptop A. El certificado la incluye y la CA puede firmarla
  # (su restricción de nombres solo permite localhost). El TLSStore de tls-prod.yaml lo sirve sin SNI.
  - target:
      kind: Certificate
      name: tienda-tls
    patch: |-
      - op: add
        path: /spec/ipAddresses
        value:
          - 100.94.162.3
  - target:
      kind: Certificate
      name: tienda-ca
    patch: |-
      - op: add
        path: /spec/nameConstraints/permitted/ipRanges/-
        value: 100.94.162.3/32
