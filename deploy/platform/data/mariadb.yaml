# MariaDB Galera (3 nodos) con MaxScale como proxy. Reemplaza a galera1-3 y galera-lb de Compose.
# La API se conecta al Service "maxscale" (puerto 3306).
# Las contraseñas viven en el Secret "mariadb-credentials" (scripts/create-dev-secrets.sh en dev, SOPS en prod).
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb
  namespace: tienda
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  image: mariadb:11.4.13
  replicas: 3
  rootPasswordSecretKeyRef:
    name: mariadb-credentials
    key: root-password
  # Base y usuario iniciales, como MARIADB_DATABASE y MARIADB_USER en Compose.
  database: store
  username: store_app
  passwordSecretKeyRef:
    name: mariadb-credentials
    key: app-password
  # Pod Security restricted (Etapa 5). El operador ya usa un usuario sin root (999); falta quitar la escalada de privilegios y las
  # capacidades, y usar el perfil seccomp por defecto. Se repiten los números del usuario porque este bloque reemplaza al del operador.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  galera:
    enabled: true
    # Los otros dos contenedores del pod (el de arranque y el agente de Galera) llevan lo mismo: el operador no les pasa
    # spec.securityContext. El CRD pide "image" en initContainer (el webhook la completa, pero kubeconform no lo sabe):
    # debe ser la misma versión que el operador (deploy/platform/operators/mariadb-operator.yaml). Al subir uno, subir el otro.
    initContainer:
      image: ghcr.io/mariadb-operator/mariadb-operator:26.10.2
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
    agent:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
  maxScaleRef:
    name: maxscale
  storage:
    size: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
  # Reparte los nodos entre los nodos del clúster, pero no bloquea si hay menos nodos que réplicas.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: mariadb
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MaxScale
metadata:
  name: maxscale
  namespace: tienda
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  image: mariadb/maxscale:24.02.9
  mariaDbRef:
    name: mariadb
  replicas: 2
  services:
    - name: rw-router
      router: readwritesplit
      listener:
        port: 3306
  monitor:
    interval: 2s
    # Necesario cuando hay más de una réplica de MaxScale.
    cooperativeMonitoring: majority_of_all
  kubernetesService:
    type: ClusterIP
  # Pod Security restricted (Etapa 5): los números del usuario son los que ya pone el operador (997:995).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 997
    runAsGroup: 995
    fsGroup: 995
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
---
# Mínimo privilegio: la API solo lee el catálogo (SELECT), así que usa su propio usuario de solo lectura.
# El Job catalog-init sigue con store_app (todos los permisos sobre la base store, para crear tablas y cargar datos).
# 60 conexiones = 6 pods de la API (máximo del HPA) x 10 del pool; el usuario store_app solo permite 20.
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: store-api
  namespace: tienda
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  mariaDbRef:
    name: mariadb
  name: store_api
  passwordSecretKeyRef:
    name: mariadb-credentials
    key: api-password
  maxUserConnections: 80 # el HPA llega a 6 pods + 1 de surge, con un pool de 10 conexiones cada uno
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: store-api-select
  namespace: tienda
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  mariaDbRef:
    name: mariadb
  privileges:
    - SELECT
  database: store
  table: "*"
  username: store_api
  host: "%"
  grantOption: false
