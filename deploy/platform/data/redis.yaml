# Redis con 1 master y 2 réplicas, vigilados por 3 Sentinel (el operador cambia el master si cae).
# La API se conecta al Service "redis-master", que siempre apunta al master actual.
# Solo es caché del catálogo (TTL de 60 s): no guarda datos que no se puedan reconstruir.
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: redis
  namespace: tienda
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # Flux crea este CR pero NO lo vuelve a aplicar. Motivo: Flux pone en cada objeto las etiquetas
    # kustomize.toolkit.fluxcd.io/name y /namespace, y el operador de Redis copia las etiquetas del CR al
    # selector (inmutable) de sus StatefulSets. Si el CR ya existía sin ellas, el operador falla al
    # reconciliar y Redis se queda sin master. Cambios al CR: kubectl apply -f deploy/platform/data/redis.yaml
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  clusterSize: 3
  # Una caída voluntaria (drenar un nodo) a la vez.
  pdb:
    enabled: true
    maxUnavailable: 1
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.0.15
    imagePullPolicy: IfNotPresent
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 192Mi }
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
  sentinel:
    size: 3
    image: quay.io/opstree/redis-sentinel:v7.0.15
    imagePullPolicy: IfNotPresent
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits: { memory: 96Mi }
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: redis
