# Mensajería: RabbitMQ solo acepta AMQP de la API y del worker; sus nodos se hablan entre sí.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq
  namespace: tienda
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  policyTypes: [Ingress, Egress]
  ingress:
    # AMQP desde la API (publica reseñas) y desde el worker (las consume).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: worker
      ports:
        - { protocol: TCP, port: 5672 }
    # Entre nodos: epmd (4369), distribución de Erlang (25672) y administración (15672).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
    # El operador (otro namespace) consulta la API de administración.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rabbitmq-system
      ports:
        - { protocol: TCP, port: 15672 }
    # El agente de OpenTelemetry lee las métricas de Prometheus.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
              app.kubernetes.io/instance: otel-agent
      ports:
        - { protocol: TCP, port: 15692 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
    # El descubrimiento de nodos pregunta a la API de Kubernetes.
    - ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
