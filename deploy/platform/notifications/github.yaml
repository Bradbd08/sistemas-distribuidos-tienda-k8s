# Flux avisa a GitHub del resultado de cada reconciliación (aparece como estado del commit).
#
# Crear o rotar el token (lo hace una persona, porque necesita un token de GitHub):
#   1. En GitHub: Settings > Developer settings > Fine-grained tokens. Repositorio: solo este.
#      Permiso: "Commit statuses: Read and write". Nada más.
#   2. Guárdalo cifrado, sin pegarlo en ningún chat:
#        kubectl -n flux-system create secret generic github-token --from-literal=token="$(read -rs t; echo $t)" \
#          --dry-run=client -o yaml > credentials/<entorno>/github-token.yaml      (dev o prod)
#        sops --encrypt --in-place credentials/<entorno>/github-token.yaml
#   3. Haz commit y push; la capa secrets aplica el Secret (dev desde main, prod al promover a release).
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Provider
metadata:
  name: github-status
  namespace: flux-system
spec:
  type: github
  address: https://github.com/Bradbd08/sistemas-distribuidos-tienda-k8s
  secretRef:
    name: github-token
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: github-status
  namespace: flux-system
spec:
  providerRef:
    name: github-status
  eventSeverity: info
  eventSources:
    - kind: Kustomization
      name: "*"
