# Loki (logs) en modo de un solo binario con almacenamiento en disco. Es lo que cabe en una laptop:
# sin Minio, sin cachés y sin gateway. Los logs entran por OTLP en http://loki.observability:3100/otlp.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 1h
  releaseName: loki
  targetNamespace: observability
  chart:
    spec:
      chart: loki
      version: 7.6.0
      sourceRef:
        kind: HelmRepository
        name: grafana
  install:
    remediation:
      retries: 3
  values:
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        retention_period: 72h
        allow_structured_metadata: true
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
    singleBinary:
      replicas: 1
      persistence:
        size: 2Gi
      resources:
        requests: { cpu: 50m, memory: 256Mi }
        limits: { memory: 768Mi }
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    gateway:
      enabled: false
    minio:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
