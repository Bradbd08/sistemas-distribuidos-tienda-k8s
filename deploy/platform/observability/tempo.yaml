# Tempo (trazas) en un solo binario, con almacenamiento local. Recibe OTLP por 4317 (gRPC) y 4318 (HTTP).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: flux-system
spec:
  interval: 1h
  releaseName: tempo
  targetNamespace: observability
  chart:
    spec:
      chart: tempo
      version: 1.24.4
      sourceRef:
        kind: HelmRepository
        name: grafana
  install:
    remediation:
      retries: 3
  values:
    fullnameOverride: tempo
    tempo:
      retention: 72h
      reportingEnabled: false
      memBallastSizeMbs: 0
      resources:
        requests: { cpu: 50m, memory: 192Mi }
        limits: { memory: 512Mi }
    persistence:
      enabled: true
      size: 2Gi
