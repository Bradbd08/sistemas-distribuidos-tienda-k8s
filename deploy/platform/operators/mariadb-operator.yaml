# Operador de MariaDB (Galera + MaxScale). Los CRDs van en su propio chart.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: mariadb-operator
  namespace: flux-system
spec:
  interval: 1h
  url: https://mariadb-operator.github.io/mariadb-operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator-crds
  namespace: flux-system
spec:
  interval: 1h
  releaseName: mariadb-operator-crds
  targetNamespace: mariadb-operator
  chart:
    spec:
      chart: mariadb-operator-crds
      version: 26.10.2
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator
  namespace: flux-system
spec:
  interval: 1h
  releaseName: mariadb-operator
  targetNamespace: mariadb-operator
  dependsOn:
    - name: mariadb-operator-crds
  chart:
    spec:
      chart: mariadb-operator
      version: 26.10.2
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator
  install:
    remediation:
      retries: 3
  values:
    # Recursos pequeños: es un clúster de desarrollo en una laptop.
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
    webhook:
      resources:
        requests: { cpu: 25m, memory: 64Mi }
        limits: { memory: 256Mi }
    certController:
      resources:
        requests: { cpu: 25m, memory: 64Mi }
        limits: { memory: 256Mi }
