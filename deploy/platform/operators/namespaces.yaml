# Namespaces que necesitan los operadores y la aplicación.
# "tienda" aloja la aplicación, las bases de datos y el operador de MongoDB: ese operador solo vigila
# el namespace donde se instala (WATCH_NAMESPACE sale del propio pod).
# La anotación prune: disabled impide que Flux borre un namespace (y con él los volúmenes) por error.
apiVersion: v1
kind: Namespace
metadata:
  name: tienda
  labels:
    # Pod Security Admission: baseline obligatorio; restricted solo avisa (warn y audit). Las bases de datos que crean
    # MariaDB y Redis aún no cumplen restricted: ver docs/05-seguridad.md.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: mariadb-operator
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: redis-operator
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
# Backends de observabilidad (Loki, Tempo, Mimir, Grafana) y los Collectors de OpenTelemetry.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
