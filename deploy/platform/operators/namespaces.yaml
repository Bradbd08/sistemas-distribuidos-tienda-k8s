# Namespaces que necesitan los operadores y la aplicación.
# "tienda" aloja la aplicación, las bases de datos y el operador de MongoDB: ese operador solo vigila
# el namespace donde se instala (WATCH_NAMESPACE sale del propio pod).
# La anotación prune: disabled impide que Flux borre un namespace (y con él los volúmenes) por error.
apiVersion: v1
kind: Namespace
metadata:
  name: tienda
  labels:
    # Pod Security Admission: restricted obligatorio. Las bases de datos que crean los operadores (MariaDB, MaxScale y
    # Redis) cumplen por el securityContext de sus recursos en deploy/platform/data/: ver docs/05-seguridad.md.
    pod-security.kubernetes.io/enforce: restricted
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: mariadb-operator
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: redis-operator
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
# Backends de observabilidad (Loki, Tempo, Mimir, Grafana) y los Collectors de OpenTelemetry.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
# cert-manager. Sus pods ya cumplen Pod Security restricted (se comprobó con una simulación en el servidor), así que es obligatorio.
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    pod-security.kubernetes.io/enforce: restricted
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
