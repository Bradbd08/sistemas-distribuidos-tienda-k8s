# Operador de Redis (OpsTree): RedisReplication + Sentinel.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ot-helm
  namespace: flux-system
spec:
  interval: 1h
  url: https://ot-container-kit.github.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-operator
  namespace: flux-system
spec:
  interval: 1h
  releaseName: redis-operator
  targetNamespace: redis-operator
  chart:
    spec:
      chart: redis-operator
      version: 0.27.0
      sourceRef:
        kind: HelmRepository
        name: ot-helm
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    redisOperator:
      imagePullPolicy: IfNotPresent
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
